# Olmec Response Clips
# Correct and incorrect responses. These get multiple takes for variety.

correct:
  - id: correct_well_done
    text: "That is correct!"
    takes: 2

  - id: correct_jello
    text: "Correct! Claim your jello shot, champion!"
    takes: 2

  - id: correct_jello_slam
    text: "Yes! Olmec demands you slam that jello shot!"
    takes: 1

  - id: correct_jello_legend
    text: "Right! Now drink up, you absolute legend!"
    takes: 1

  - id: correct_jello_jiggle
    text: "Correct, mortal! A jello shot for you!"
    takes: 1

  - id: correct_jello_wisdom
    text: "Yes! Wisdom is its own reward... but also jello shots!"
    takes: 1

  - id: correct_jello_temple
    text: "That is right! The temple rewards you with a jello shot!"
    takes: 1

  - id: correct_jello_visions
    text: "Correct! May this jello shot bring you visions of the hidden temple!"
    takes: 1

incorrect:
  - id: incorrect_not_quite
    text: "I'm afraid that is not correct."
    takes: 2

# Correct responses when jello shots are unavailable
correct_no_jello:
  - id: correct_no_jello_worthy
    text: "That is correct! You have proven yourself worthy!"
    takes: 1

  - id: correct_no_jello_gods
    text: "Correct! The temple gods smile upon you!"
    takes: 1

  - id: correct_no_jello_wise
    text: "Right you are! Wisdom flows through you, mortal."
    takes: 1

  - id: correct_no_jello_pendant
    text: "Correct! You have earned the Pendant of Life!"
    takes: 1

  - id: correct_no_jello_brilliant
    text: "Yes! A brilliant answer from a brilliant mind."
    takes: 1

  - id: correct_no_jello_impressed
    text: "Correct! Olmec is impressed."
    takes: 1

  - id: correct_no_jello_chosen
    text: "That is right! You are chosen by the temple."
    takes: 1

  - id: correct_no_jello_legends
    text: "Yes! Your name shall be sung in the legends!"
    takes: 1
