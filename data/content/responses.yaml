# Olmec Response Clips
# Correct and incorrect responses. These get multiple takes for variety.

correct:
  - id: correct_dab_bar
    text: "That is correct. As a prize, you have earned one all expenses paid trip to the dab bar."
    takes: 1

  - id: correct_walnuts
    text: "That is correct. You win all the walnuts you can eat."
    takes: 1

  - id: correct_you_rock
    text: "Correct! You rock."
    takes: 1

  - id: correct_smell_cooking
    text: "Correct. You indeed could smell what this rock is cooking."
    takes: 1

  - id: correct_buzzed_in
    text: "You have buzzzzzzzed in with the correct answer."
    takes: 1

  - id: correct_sweet_honey
    text: "That answer was sweet as honey."
    takes: 1

incorrect:
  - id: incorrect_not_quite
    text: "I'm afraid that is not correct."
    takes: 2

# No correct_no_jello section: when jello is off, the runtime falls back
# to the 'correct' clips above (see api/ws.py judge_correct handler).
